services:
  mcp-ultimate:
    build: .
    image: mcp-ultimate:latest
    container_name: mcp-ultimate
    ports:
      - "8088:8088"
    environment:
      # ============================================================
      # COMMONLY CONFIGURED -- review these for your deployment.
      # Set actual values in .env (copy env.example), not here.
      # ============================================================

      # Your SearXNG instance. Must be reachable from inside the container --
      # a LAN IP (not "localhost") works regardless of which machine runs this.
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng.local:8080}

      # Local LLM bridge (ask_local_llm) -- your own self-hosted Open WebUI
      # instance. Point this at a real LAN address (not "localhost"), e.g.
      # http://192.168.1.50:3000/api -- note the path ends in /api, not /v1.
      # Leave blank to skip this backend entirely.
      - OPENWEBUI_URL=${OPENWEBUI_URL:-}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      # Cloud fallbacks for ask_local_llm -- both need your own API key and
      # an explicit model id (see ADVANCED section below for the *_MODEL
      # vars; there's no sensible auto-picked default when a provider hosts
      # many models with real per-token cost). Leave the API key blank to
      # skip a backend entirely.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

      # Identity attached to commits made by git_commit. Change to your own
      # name/email if you want commits attributable to you instead of the
      # generic default -- git reads these env vars directly, no `git
      # config` needed.
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-mcp-ultimate}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-mcp-ultimate@localhost}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-mcp-ultimate}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-mcp-ultimate@localhost}

      # Port this server listens on inside the container. Change the
      # "8088:8088" mapping above to match if you change this.
      - MCP_PORT=${MCP_PORT:-8088}

      # ============================================================
      # ADVANCED -- sensible defaults, change only if you have a reason.
      # Not in env.example; add a line there if you want to override one.
      # ============================================================

      # web_search/search_news try Bing (scraped) before SearXNG by default.
      # "false" reverses that: SearXNG first (faster, self-hosted), Bing as
      # the fallback instead.
      - SEARCH_PREFER_BROWSER=${SEARCH_PREFER_BROWSER:-true}

      # run_command timeout (s), and the output-truncation limit shared by
      # sandbox/git_*/coding tools.
      - SANDBOX_CMD_TIMEOUT=${SANDBOX_CMD_TIMEOUT:-60}
      - SANDBOX_MAX_OUTPUT=${SANDBOX_MAX_OUTPUT:-20000}

      # Outbound HTTP timeout (s) for weather/news/web_search/currency/
      # crypto/fetch_url.
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-10}

      # REQUIRED if you use gemini/openrouter at all -- both host many models
      # with real per-token cost, so there's no sensible default to fall
      # back to. Pick a model id from the provider's own model list.
      # Examples (verify current ids against each provider -- these change):
      # GEMINI_MODEL=gemini-2.5-flash
      # OPENROUTER_MODEL=anthropic/claude-sonnet-4.5
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Only set if your Open WebUI instance has multiple models loaded and
      # you need to pin one -- leave blank to auto-detect the first available.
      - OPENWEBUI_MODEL=${OPENWEBUI_MODEL:-}
      - LOCAL_LLM_TIMEOUT=${LOCAL_LLM_TIMEOUT:-60}

      # Leave blank to randomize across a pool of real desktop browser UAs
      # per request; set one exact string to pin it instead.
      - BROWSER_USER_AGENT=${BROWSER_USER_AGENT:-}
      - BROWSER_TIMEOUT_MS=${BROWSER_TIMEOUT_MS:-20000}
      - BROWSER_VIEWPORT_WIDTH=${BROWSER_VIEWPORT_WIDTH:-1920}
      - BROWSER_VIEWPORT_HEIGHT=${BROWSER_VIEWPORT_HEIGHT:-1080}

      - WEATHER_FORECAST_DAYS=${WEATHER_FORECAST_DAYS:-3}
      - GIT_TIMEOUT=${GIT_TIMEOUT:-120}
      - PYTHON_TIMEOUT=${PYTHON_TIMEOUT:-30}

      # Internal -- do not change. Must match the volume mount below.
      - SANDBOX_WORKSPACE=/workspace

      # ============================================================
      # SKILL TOGGLES -- set any to "false" to hide that skill's tools
      # from the MCP tool list entirely (the module isn't even imported).
      # Note: a skill that imports another skill's plain functions directly
      # still works even if the imported skill is disabled here -- e.g.
      # itinerary keeps using flights/weather/web_search's functions even if
      # those three are individually disabled below, since it imports them
      # directly; same for git/coding reusing sandbox's path-safety helpers.
      # Disabling only hides a skill's OWN tools, not its code being reused
      # by others.
      # ============================================================
      - SKILL_BROWSER_ENABLED=${SKILL_BROWSER_ENABLED:-true}
      - SKILL_CARS_ENABLED=${SKILL_CARS_ENABLED:-true}
      - SKILL_CODING_ENABLED=${SKILL_CODING_ENABLED:-true}
      - SKILL_CONTENT_ENABLED=${SKILL_CONTENT_ENABLED:-true}
      - SKILL_DATABASE_ENABLED=${SKILL_DATABASE_ENABLED:-true}
      - SKILL_FLIGHTS_ENABLED=${SKILL_FLIGHTS_ENABLED:-true}
      - SKILL_GIT_ENABLED=${SKILL_GIT_ENABLED:-true}
      - SKILL_HOTELS_ENABLED=${SKILL_HOTELS_ENABLED:-true}
      - SKILL_ITINERARY_ENABLED=${SKILL_ITINERARY_ENABLED:-true}
      - SKILL_KNOWLEDGE_BASE_ENABLED=${SKILL_KNOWLEDGE_BASE_ENABLED:-true}
      - SKILL_KNOWLEDGE_GRAPH_ENABLED=${SKILL_KNOWLEDGE_GRAPH_ENABLED:-true}
      - SKILL_LOCAL_LLM_ENABLED=${SKILL_LOCAL_LLM_ENABLED:-true}
      - SKILL_MEMORY_ENABLED=${SKILL_MEMORY_ENABLED:-true}
      - SKILL_NEWS_ENABLED=${SKILL_NEWS_ENABLED:-true}
      - SKILL_PACKAGES_ENABLED=${SKILL_PACKAGES_ENABLED:-true}
      - SKILL_SANDBOX_ENABLED=${SKILL_SANDBOX_ENABLED:-true}
      - SKILL_TOOLBOX_ENABLED=${SKILL_TOOLBOX_ENABLED:-true}
      - SKILL_UTILS_ENABLED=${SKILL_UTILS_ENABLED:-true}
      - SKILL_WEATHER_ENABLED=${SKILL_WEATHER_ENABLED:-true}
      - SKILL_WEB_SEARCH_ENABLED=${SKILL_WEB_SEARCH_ENABLED:-true}
    volumes:
      - mcp_workspace:/workspace
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

volumes:
  mcp_workspace:
